<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Main Central Card / Clipboard -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="100" width="280" height="330" rx="36" fill="url(#cardGrad)" />
  </g>

  <!-- Clipboard Top Clip -->
  <rect x="196" y="80" width="120" height="40" rx="14" fill="#047857" />
  <rect x="226" y="94" width="60" height="12" rx="6" fill="#ffffff" opacity="0.9" />

  <!-- Header Banner on Card -->
  <rect x="146" y="145" width="220" height="32" rx="8" fill="#ecfdf5" />
  <text x="256" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="2">KALBE MOTORIS</text>

  <!-- Document / Report Content Lines -->
  <!-- Line 1: Calculator / Money / SHJ -->
  <rect x="146" y="196" width="140" height="14" rx="7" fill="#059669" />
  <rect x="306" y="196" width="60" height="14" rx="7" fill="#10b981" opacity="0.6" />

  <!-- Line 2: Items / Products -->
  <rect x="146" y="226" width="100" height="12" rx="6" fill="#94a3b8" />
  <rect x="266" y="226" width="100" height="12" rx="6" fill="#cbd5e1" />

  <!-- Line 3: DOF / Report -->
  <rect x="146" y="254" width="120" height="12" rx="6" fill="#94a3b8" />
  <rect x="286" y="254" width="80" height="12" rx="6" fill="#cbd5e1" />

  <!-- Checkmark / Delivery Badge Icon -->
  <g transform="translate(256, 345)">
    <circle r="44" fill="url(#accentGrad)" filter="url(#dropShadow)" />
    <!-- Checkmark SVG -->
    <path d="M-18 -2 L-6 12 L20 -14" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="3">MMTW SUKABUMI</text>
</svg>
